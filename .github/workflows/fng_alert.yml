name: Daily Fear and Greed Index Alert

on:
  schedule:
    # 매일 UTC 22:35 실행 (한국 시간 KST 매일 아침 07:35)
    # 정각(:00)과 30분(:30)은 GitHub 부하로 인한 지연/누락이 잦아 35분으로 설정
    - cron: '35 22 * * *'
  workflow_dispatch: # GitHub 웹페이지(Actions 탭)에서 'Run workflow' 버튼으로 즉시 수동 테스트 가능

jobs:
  send-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib

      - name: Run notification script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8538544741:AAFuPK-A0lcc0-rSUOHzO2zWD4T0ANVqV_c' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '6809012214' }}
        run: python send_fear_greed.py
