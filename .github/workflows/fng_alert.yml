name: Daily Fear and Greed Index Alert

on:
  schedule:
    # 매일 UTC 22:30 실행 (한국 시간 KST 매일 아침 07:30)
    - cron: '30 22 * * *'
  workflow_dispatch: # GitHub 웹페이지(Actions 탭)에서 'Run workflow' 버튼으로 즉시 수동 테스트 가능

jobs:
  send-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run notification script
        env:
          TELEGRAM_BOT_TOKEN: "8538544741:AAFuPK-A0lcc0-rSUOHzO2zWD4T0ANVqV_c"
          TELEGRAM_CHAT_ID: "6809012214"
        run: python send_fear_greed.py
